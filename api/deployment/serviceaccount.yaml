apiVersion: v1
kind: ServiceAccount
metadata:
  name: claim-selection-api
  namespace: claim-selection
  labels:
    app: claim-selection-api
  annotations:
    # IAM role the API uses for the Aurora IAM database login (IRSA on EKS). The role needs rds-db:connect for the database user.
    eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<claim-selection-api-role>
